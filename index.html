<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Srisakdi:wght@700&display=swap" rel="stylesheet">
<title>ทายผี</title>
<style>
  body{margin:0;height:100vh;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#000;color:#fff;font-family:"Srisakdi",serif;font-weight:bold;text-align:center;cursor:none;user-select:none}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 40%,#000 95%)}
  #no{font-size:3vw;color:#e00;letter-spacing:.3em;margin-bottom:2vh}
  #text{font-size:8vw;padding:0 5vw;line-height:1.3}
  #bar{position:fixed;bottom:0;left:0;height:6px;background:#e00}
  .q #text{animation:flicker 4s infinite}
  .a #text{color:#e00;animation:jump .5s ease-out;text-shadow:0 0 30px #e00}
  .a #no{color:#fff}
  .flash{animation:flash .4s}
  @keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.2}95%{opacity:1}96%{opacity:.4}}
  @keyframes jump{0%{transform:scale(3);opacity:0}60%{transform:scale(.9)}80%{transform:translateX(-10px)}90%{transform:translateX(10px)}100%{transform:none}}
  @keyframes flash{0%{background:#e00}100%{background:#000}}
  #end{display:none}
  .end #no,.end #text,.end #bar{display:none}
  .end #end{display:block;animation:rise 1.5s ease-out}
  .brand{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:9vw;letter-spacing:.15em;
    color:#e00;text-shadow:0 0 40px #e00;animation:flicker 3s infinite}
  .th{font-size:11vw;line-height:1.2;margin:1vh 0}
  .en{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:3vw;letter-spacing:1em;margin-right:-1em}
  @keyframes rise{0%{opacity:0;transform:scale(1.3);filter:blur(20px)}100%{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<div id="no"></div>
<div id="text"></div>
<div id="bar"></div>
<div id="end">
  <div class="brand">TAWANDANG</div>
  <div class="th">ราตรีผีแดนซ์</div>
  <div class="en">HALLOWEEN NIGHT</div>
</div>
<script>
const QUESTIONS = [
  ["ผีอะไรกลัวกระเทียม?", "แดร็กคูล่า"],
  ["ผีอะไรชอบกินไก่?", "ผีปอบ"],
  ["ผีอะไรดูดเลือดคน?", "แวมไพร์"],
  ["ผีอะไรชอบอยู่ต้นกล้วย?", "ผีตานี"],
  ["ผีอะไรมีตำนานรักอมตะ รอสามีกลับ?", "แม่นาค"],
  ["ผีอะไรตัวสูง แต่ปากเท่ารูเข็ม?", "เปรต"],
  ["ผีอะไรมีแต่หัว ไส้ห้อย ลอยได้?", "ผีกระสือ"],
  ["ผีอะไรเป็นแสงไฟ ชอบกินของสกปรก?", "ผีโพง"],
  ["ผีอะไรอยู่ในบ้าน คอยปกป้องคนในบ้าน?", "ผีเรือน"],
  ["ผีอะไรกระโดดตัวแข็ง ต้องแปะยันต์ที่หน้าผาก?", "ผีกัดคอจีน (เจียงซือ)"],
  ["ผีอะไรโสด?", "ผีไม่มัว"],
  ["ผีอะไรอ้วนอยู่อย่างนั้น?", "ผีไม่ได้ซักทอม"],
];
const TIME = 15; // วินาทีให้ทาย
let pages, i, timer;
const $ = id => document.getElementById(id);

function newRound() { // สุ่มลำดับใหม่ ไม่ซ้ำจนครบ แล้วจบด้วยหน้าปิด
  const q = [...QUESTIONS];
  for (let k = q.length - 1; k > 0; k--) {
    const r = Math.floor(Math.random() * (k + 1));
    [q[k], q[r]] = [q[r], q[k]];
  }
  pages = q.flatMap(([t, a]) => [[t, "q"], [a, "a"]]);
  pages.push(["", "end"]);
  i = 0;
  show();
}

function show() {
  const [t, type] = pages[i];
  document.body.className = type;
  $("text").textContent = t;
  $("no").textContent = type === "a" ? "เฉลย" : "";
  clearInterval(timer);
  $("bar").style.width = 0;
  if (type === "q") countdown();
  if (type === "a") document.body.classList.add("flash");
}
function countdown() {
  let left = TIME * 10;
  $("bar").style.width = "100%";
  timer = setInterval(() => {
    left--;
    $("bar").style.width = (left / (TIME * 10)) * 100 + "%";
    if (left <= 0) clearInterval(timer);
  }, 100);
}
function go(d) {
  if (d > 0 && i === pages.length - 1) return newRound(); // หน้าปิด → เริ่มรอบใหม่
  i = Math.max(0, i + d);
  show();
}
document.body.onclick = () => go(1);
document.onkeydown = e => {
  if (["ArrowRight", " ", "Enter"].includes(e.key)) go(1);
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "f") document.documentElement.requestFullscreen();
};
newRound();
</script>
</body>
</html>
